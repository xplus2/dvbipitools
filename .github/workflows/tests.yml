name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      matrix:
        include:
          - name: plain
            sanitize: OFF
            tsan: OFF
          - name: asan-ubsan
            sanitize: ON
            tsan: OFF
          - name: tsan
            sanitize: OFF
            tsan: ON
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev check ffmpeg librist-dev libsrt-openssl-dev \
            libnghttp2-dev libdvbcsa1
      - name: install tsduck
        run: |
          curl -fsSL -o tsduck.deb https://github.com/tsduck/tsduck/releases/download/v3.44-4676/tsduck_3.44-4676.ubuntu26_amd64.deb
          sudo apt-get install -y ./tsduck.deb
      - name: build ngtcp2 + nghttp3 (static)
        run: |
          curl -fsSL https://github.com/ngtcp2/nghttp3/releases/download/v1.17.0/nghttp3-1.17.0.tar.xz | tar xJ -C /tmp
          curl -fsSL https://github.com/ngtcp2/ngtcp2/releases/download/v1.24.0/ngtcp2-1.24.0.tar.xz | tar xJ -C /tmp
          H3_ARGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/h3-static -DCMAKE_INSTALL_LIBDIR=lib"
          H3_ARGS="$H3_ARGS -DENABLE_LIB_ONLY=ON -DENABLE_SHARED_LIB=OFF -DENABLE_STATIC_LIB=ON -DBUILD_TESTING=OFF"
          cmake -S /tmp/nghttp3-1.17.0 -B /tmp/nghttp3-build $H3_ARGS
          cmake --build /tmp/nghttp3-build -j"$(nproc)"
          cmake --install /tmp/nghttp3-build
          cmake -S /tmp/ngtcp2-1.24.0 -B /tmp/ngtcp2-build $H3_ARGS -DENABLE_OPENSSL=ON
          cmake --build /tmp/ngtcp2-build -j"$(nproc)"
          cmake --install /tmp/ngtcp2-build
      - name: configure
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH=${{ github.workspace }}/h3-static/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDVBIPITOOLS_TESTS=ON -DDVBIPITOOLS_SANITIZE=${{ matrix.sanitize }} -DDVBIPITOOLS_TSAN=${{ matrix.tsan }} 2>&1 | tee configure.log
          grep -q "Performing Test DIPIXY_HAVE_OPENSSL_QUIC - Success" configure.log
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev check ffmpeg librist-dev libsrt-openssl-dev \
            libnghttp2-dev libdvbcsa1 jq pipx
          pipx install gcovr
      - name: install tsduck
        run: |
          curl -fsSL -o tsduck.deb https://github.com/tsduck/tsduck/releases/download/v3.44-4676/tsduck_3.44-4676.ubuntu26_amd64.deb
          sudo apt-get install -y ./tsduck.deb
      - name: build ngtcp2 + nghttp3 (static)
        run: |
          curl -fsSL https://github.com/ngtcp2/nghttp3/releases/download/v1.17.0/nghttp3-1.17.0.tar.xz | tar xJ -C /tmp
          curl -fsSL https://github.com/ngtcp2/ngtcp2/releases/download/v1.24.0/ngtcp2-1.24.0.tar.xz | tar xJ -C /tmp
          H3_ARGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/h3-static -DCMAKE_INSTALL_LIBDIR=lib"
          H3_ARGS="$H3_ARGS -DENABLE_LIB_ONLY=ON -DENABLE_SHARED_LIB=OFF -DENABLE_STATIC_LIB=ON -DBUILD_TESTING=OFF"
          cmake -S /tmp/nghttp3-1.17.0 -B /tmp/nghttp3-build $H3_ARGS
          cmake --build /tmp/nghttp3-build -j"$(nproc)"
          cmake --install /tmp/nghttp3-build
          cmake -S /tmp/ngtcp2-1.24.0 -B /tmp/ngtcp2-build $H3_ARGS -DENABLE_OPENSSL=ON
          cmake --build /tmp/ngtcp2-build -j"$(nproc)"
          cmake --install /tmp/ngtcp2-build
      - name: configure
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH=${{ github.workspace }}/h3-static/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDVBIPITOOLS_TESTS=ON -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic -O0" -DCMAKE_EXE_LINKER_FLAGS=--coverage 2>&1 | tee configure.log
          grep -q "Performing Test DIPIXY_HAVE_OPENSSL_QUIC - Success" configure.log
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: coverage report
        if: always()
        run: |
          COMMON=(--root . --object-directory build --filter src/ --exclude-directories '.*/CMakeFiles/[0-9.]+' --exclude-throw-branches --exclude-unreachable-branches --merge-lines --gcov-ignore-parse-errors=negative_hits.warn_once_per_file)
          mkdir -p coverage
          gcovr "${COMMON[@]}" --exclude 'src/lib/vendor/' --json-summary coverage/src-novendor.json --txt coverage/src-novendor.txt
          summarize() {
            echo "## $1"
            echo ""
            jq -r '
              def pct(c; t): if t == 0 then "-" else "\(((c * 1000 / t) | round) / 10)%" end;
              def row(n; fs):
                (fs | map(.line_covered) | add) as $lc | (fs | map(.line_total) | add) as $lt |
                (fs | map(.function_covered) | add) as $fc | (fs | map(.function_total) | add) as $ft |
                (fs | map(.branch_covered) | add) as $bc | (fs | map(.branch_total) | add) as $bt |
                "| \(n) | \($lc)/\($lt) | \(pct($lc; $lt)) | \($fc)/\($ft) | \(pct($fc; $ft)) | \($bc)/\($bt) | \(pct($bc; $bt)) |";
              "| module | lines | % | functions | % | branches | % |",
              "|---|---|---|---|---|---|---|",
              (.files
                | map(. + {mod: (.filename | split("/") | if .[1] == "lib" then .[0:3] else .[0:2] end | join("/"))})
                | group_by(.mod) | .[] | row(.[0].mod; .)),
              row("**total**"; .files)
            ' "$2"
            echo ""
          }
          summarize "Coverage: src/ excl. src/lib/vendor/" coverage/src-novendor.json >> "$GITHUB_STEP_SUMMARY"
          tail -n 4 coverage/src-novendor.txt
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  bonding-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev check iproute2 curl librist-dev
      - name: build libsrt with bonding
        run: |
          curl -fsSL -o srt.tar.gz https://github.com/Haivision/srt/archive/refs/tags/v1.5.6.tar.gz
          mkdir srt-src
          tar xzf srt.tar.gz -C srt-src --strip-components=1
          cmake -S srt-src -B srt-src/bld -DENABLE_BONDING=ON -DENABLE_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build srt-src/bld -j"$(nproc)"
          sudo cmake --install srt-src/bld
          sudo ldconfig
      - name: configure
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DDVBIPITOOLS_TESTS=ON 2>&1 | tee configure.log
          grep -q "Performing Test DVBIPITOOLS_SRT_HAVE_BONDING - Success" configure.log
      - name: build
        run: |
          cmake --build build -j"$(nproc)"
          test -x build/src/dipirist/dipirist
      - name: bonding tests
        run: sudo ctest --test-dir build --output-on-failure -R bonding | tee bonding-results.log
      - name: collect failure diagnostics
        if: always()
        run: |
          mkdir -p bonding-diagnostics
          grep -oE '/tmp/tmp\.[A-Za-z0-9]+' bonding-results.log | sort -u | while read -r d; do
            [ -d "$d" ] && cp -r "$d" "bonding-diagnostics/$(basename "$d")"
          done || true
          echo "found_any=$([ -n "$(ls -A bonding-diagnostics)" ] && echo true || echo false)" >> "$GITHUB_ENV"
      - name: upload failure diagnostics
        if: always() && env.found_any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bonding-failure-diagnostics
          path: bonding-diagnostics
          retention-days: 14
      - name: bonding results summary
        if: always()
        run: |
          {
            echo "## Bonding scenario results"
            echo ""
            echo "| test | configured impairment | result | observed data |"
            echo "|---|---|---|---|"
            for t in \
              integration_dipisrt_bonding_loss \
              integration_dipisrt_bonding_reorder \
              integration_dipisrt_bonding_link_flap \
              integration_dipisrt_bonding_disappearance_recovery \
              integration_dipisrt_bonding_jitter \
              integration_dipisrt_bonding_combined \
              integration_dipirist_bonding_roundtrip \
              integration_dipirist_bonding_loss \
              integration_dipirist_bonding_reorder \
              integration_dipirist_bonding_link_flap \
              integration_dipirist_bonding_disappearance_recovery \
            ; do
              case "$t" in
                integration_dipisrt_bonding_loss) impair="30% loss, one link" ;;
                integration_dipisrt_bonding_reorder) impair="90% reorder, one link" ;;
                integration_dipisrt_bonding_link_flap) impair="100% loss flapping, one link" ;;
                integration_dipisrt_bonding_disappearance_recovery) impair="100% loss then recovery, one link" ;;
                integration_dipisrt_bonding_jitter) impair="60ms+-40ms delay, one link" ;;
                integration_dipisrt_bonding_combined) impair="25-95% loss both links, staggered" ;;
                integration_dipirist_bonding_roundtrip) impair="none" ;;
                integration_dipirist_bonding_loss) impair="30% loss, one link" ;;
                integration_dipirist_bonding_reorder) impair="90% reorder, one link" ;;
                integration_dipirist_bonding_link_flap) impair="100% loss flapping, one link" ;;
                integration_dipirist_bonding_disappearance_recovery) impair="100% loss then recovery, one link" ;;
              esac
              result=$(grep -q "$t .*Passed" bonding-results.log && echo pass || echo fail)
              observed="n/a (pass, no logs kept)"
              [ "$result" = fail ] && observed="raw send/recv logs in bonding-failure-diagnostics artifact"
              echo "| $t | $impair | $result | $observed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 -I src --quiet src/ \
            2>&1 | tee cppcheck-report.txt
      - name: upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  fuzz-smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev afl++
      - name: configure (afl-clang-fast)
        run: cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DDVBIPITOOLS_FUZZING=ON -DCMAKE_C_COMPILER=afl-clang-fast
      - name: build harnesses
        run: cmake --build build-fuzz -j"$(nproc)" --target fuzz_psi fuzz_sds_xml fuzz_rtcp fuzz_simulcrypt_msg fuzz_ecmg_channel_status fuzz_emmg_datagrams fuzz_yamlcfg fuzz_gen_seeds
      - name: generate seeds
        run: |
          mkdir -p afl-in
          build-fuzz/tests/fuzz/fuzz_gen_seeds afl-in
      - name: fuzz smoke (60s per harness)
        env:
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        run: |
          fail=0
          for h in fuzz_psi fuzz_sds_xml fuzz_rtcp fuzz_simulcrypt_msg fuzz_ecmg_channel_status fuzz_emmg_datagrams fuzz_yamlcfg; do
            echo "=== $h ==="
            mkdir -p "afl-out/$h"
            set +e
            timeout 90 afl-fuzz -i afl-in -o "afl-out/$h" -V 60 -- "build-fuzz/tests/fuzz/$h" @@
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "$h: afl-fuzz exited abnormally (rc=$rc)"
              fail=1
            fi
            if [ ! -s "afl-out/$h/default/fuzzer_stats" ]; then
              echo "$h: no fuzzer_stats written, run never started"
              fail=1
            fi
            if [ -n "$(ls -A "afl-out/$h/default/crashes" 2>/dev/null)" ]; then
              echo "$h: crash found"
              fail=1
            fi
          done
          exit $fail
      - name: upload crashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-crashes
          path: afl-out/*/default/crashes
          if-no-files-found: ignore
