name: Release tarball

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: i386
            triplet: i686-linux-gnu
            sysproc: i686
            crosspkg: crossbuild-essential-i386
            mesoncpu: x86
          - arch: armel
            triplet: arm-linux-gnueabi
            sysproc: arm
            crosspkg: crossbuild-essential-armel
            mesoncpu: arm
          - arch: armhf
            triplet: arm-linux-gnueabihf
            sysproc: arm
            crosspkg: crossbuild-essential-armhf
            mesoncpu: arm
          - arch: arm64
            triplet: aarch64-linux-gnu
            sysproc: aarch64
            crosspkg: crossbuild-essential-arm64
            mesoncpu: aarch64
          - arch: ppc64el
            triplet: powerpc64le-linux-gnu
            sysproc: ppc64le
            crosspkg: crossbuild-essential-ppc64el
            mesoncpu: ppc64
          - arch: riscv64
            triplet: riscv64-linux-gnu
            sysproc: riscv64
            crosspkg: crossbuild-essential-riscv64
            mesoncpu: riscv64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libssl-dev ${{ matrix.crosspkg }}
        # i386/armel: no libssl-dev on Ubuntu, see -DDIPIRADIOHEAD_TLS=OFF below. others: ports arches, scoped update from ports.ubuntu.com
        case "${{ matrix.arch }}" in
          i386|armel|amd64) ;;
          *)
            sudo dpkg --add-architecture ${{ matrix.arch }}
            CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
            {
              echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $CODENAME main universe restricted multiverse"
              echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main universe restricted multiverse"
              echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main universe restricted multiverse"
            } | sudo tee /etc/apt/sources.list.d/ports-${{ matrix.arch }}.list
            sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ports-${{ matrix.arch }}.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y libssl-dev:${{ matrix.arch }}
            ;;
        esac
    - name: build librist (static)
      run: |
        sudo apt-get install -y meson ninja-build libmbedtls-dev
        case "${{ matrix.arch }}" in
          i386|armel|amd64) ;;
          *) sudo apt-get install -y libmbedtls-dev:${{ matrix.arch }} ;;
        esac
        curl -sL "https://code.videolan.org/rist/librist/-/archive/v0.2.20/librist-v0.2.20.tar.gz" | tar xz -C /tmp
        MESON_ARGS="--default-library=static --libdir=lib --prefix=${{ github.workspace }}/librist-static -Dbuiltin_cjson=true -Duse_mbedtls=true -Dbuiltin_mbedtls=false -Dtest=false -Dbuilt_tools=false"
        if [ -n "${{ matrix.triplet }}" ]; then
          cat > /tmp/librist-cross.ini <<EOF
        [binaries]
        c = '${{ matrix.triplet }}-gcc'
        ar = '${{ matrix.triplet }}-ar'
        strip = '${{ matrix.triplet }}-strip'
        pkg-config = 'pkg-config'

        [host_machine]
        system = 'linux'
        cpu_family = '${{ matrix.mesoncpu }}'
        cpu = '${{ matrix.sysproc }}'
        endian = 'little'
        EOF
          MESON_ARGS="$MESON_ARGS --cross-file /tmp/librist-cross.ini"
        fi
        meson setup /tmp/librist-build /tmp/librist-v0.2.20 $MESON_ARGS
        ninja -C /tmp/librist-build install
    - name: configure
      run: |
        CROSS_ARGS=""
        if [ -n "${{ matrix.triplet }}" ]; then
          CROSS_ARGS="-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.sysproc }} -DCMAKE_C_COMPILER=${{ matrix.triplet }}-gcc -DCMAKE_LIBRARY_ARCHITECTURE=${{ matrix.triplet }}"
        fi
        TLS_ARGS=""
        case "${{ matrix.arch }}" in
          i386|armel) TLS_ARGS="-DDIPIRADIOHEAD_TLS=OFF -DDIPITVHEAD_TLS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON" ;;
          amd64) ;;
          *) TLS_ARGS="-DOPENSSL_INCLUDE_DIR=/usr/include -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/${{ matrix.triplet }}/libcrypto.a -DOPENSSL_SSL_LIBRARY=/usr/lib/${{ matrix.triplet }}/libssl.a" ;;
        esac
        export PKG_CONFIG_PATH="${{ github.workspace }}/librist-static/lib/pkgconfig:$PKG_CONFIG_PATH"
        cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DDVBIPITOOLS_STATIC=ON $CROSS_ARGS $TLS_ARGS
    - name: make
      run: cmake --build ${{github.workspace}}/build --config Release
    - name: packaging
      run: |
        PKGDIR="dvbipitools-${{github.ref_name}}-linux-${{ matrix.arch }}"
        mkdir "${PKGDIR}"
        install -m 0755 build/src/dipirec/dipirec "${PKGDIR}/"
        install -m 0755 build/src/dipiscan/dipiscan "${PKGDIR}/"
        install -m 0755 build/src/dipiradiohead/dipiradiohead "${PKGDIR}/"
        install -m 0755 build/src/dipisds/dipisds "${PKGDIR}/"
        install -m 0755 build/src/dipixmltv/dipixmltv "${PKGDIR}/"
        install -m 0755 build/src/dipibim/dipibim "${PKGDIR}/"
        install -m 0755 build/src/dipibcg/dipibcg "${PKGDIR}/"
        install -m 0755 build/src/dipitvhead/dipitvhead "${PKGDIR}/"
        install -m 0755 build/src/dipifccret/dipifccret "${PKGDIR}/"
        # dipicam378 needs OpenSSL, unavailable on i386/armel here - same skip-if-missing pattern
        [ -f build/src/dipicam378/dipicam378 ] && install -m 0755 build/src/dipicam378/dipicam378 "${PKGDIR}/"
        # dipirist: skip if static librist build failed this arch
        [ -f build/src/dipirist/dipirist ] && install -m 0755 build/src/dipirist/dipirist "${PKGDIR}/"
        tar czf "${PKGDIR}.tar.gz" "${PKGDIR}"
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: tarball-${{ matrix.arch }}
        path: dvbipitools-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        pattern: tarball-*
        merge-multiple: true
        path: dist
    - name: assets
      uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
      with:
        files: dist/*.tar.gz
