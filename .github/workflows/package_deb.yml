name: Debian package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            image: debian:trixie
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:trixie
          - arch: armhf
            runner: ubuntu-latest
            image: debian:bookworm
            platform: linux/arm/v7
          - arch: ppc64el
            runner: ubuntu-latest
            image: debian:trixie
            platform: linux/ppc64le
          - arch: riscv64
            runner: ubuntu-latest
            image: debian:trixie
            platform: linux/riscv64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: docker/setup-qemu-action@2221d2d9a3106118d4e4582f348f00063d820894 # v3.0.0
      if: matrix.platform
    - name: build in container
      run: |
        PARENT="$(dirname "${{ github.workspace }}")"
        NAME="$(basename "${{ github.workspace }}")"
        PLATFORM_ARGS=""
        if [ -n "${{ matrix.platform }}" ]; then
          PLATFORM_ARGS="--platform ${{ matrix.platform }}"
        fi
        docker run --rm $PLATFORM_ARGS \
          -v "$PARENT:/work" -w "/work/$NAME" \
          ${{ matrix.image }} \
          bash -c '
            set -ex
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y build-essential cmake debhelper devscripts libssl-dev
            apt-get install -y libdvbcsa-dev || echo "::warning::libdvbcsa-dev not available for ${{ matrix.arch }}/${{ matrix.image }}, dipidescramble/dipitvhead/dipiradiohead will build with the CSA2 stub"
            dpkg-buildpackage -us -uc -b
          '
        mv "$PARENT"/*.deb .
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: deb-${{ matrix.arch }}
        path: '*.deb'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dec800d1 # v5.0.0
      with:
        pattern: deb-*
        merge-multiple: true
        path: dist
    - name: assets
      uses: softprops/action-gh-release@c95fe1489396fe5a219ad6e302466378ecece42b # v2.0.8
      with:
        files: dist/*.deb
