#format: ts
# -p|--pmt-pid [not set]
#pmt-pid: all
# -s|--subtitles keep # strip|keep|srt
subtitles: keep
# -t|--time [not set]
#time: 1h30m
# -I|--iface [not set]
#iface: <iface>
# -O|--out-iface [not set]
