# --al-fec-port [not set]
#al-fec-port: <port>
# --profile simple # simple|main
#profile: simple
# --secret [not set]
#secret: <psk>
# --cname [not set]
#cname: <name>
# --buffer [not set] # ms
#buffer: <ms>
# --profile-in simple # simple|main
#profile-in: simple
# --insecure off
insecure: off
# -v|--verbose off
verbose: off
