sub-lead: 1000
# --color auto # auto|always|never
color: auto
# --pace off
#pace: off
# --strip NUL,NIT,AIT,EIT
#strip: NUL,NIT,AIT,EIT

metrics:
  # --metrics /run/dvbipitools/metrics.sock
  #sock: /run/dvbipitools/metrics.sock
