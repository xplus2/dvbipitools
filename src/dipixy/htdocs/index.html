<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dipixy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh;font-size:14px}
nav{background-color:#eee; flex:0 0 180px;border-right:1px solid #888;padding:4px 12px;display:flex;flex-direction:column;overflow:auto}
nav button{display:block;width:100%;text-align:left;padding:6px 0;margin:2px 0;border:0;background:none;cursor:pointer;font:inherit;color:inherit}
nav button:hover{color:#f90}
nav hr{height:1px;width:100%;border-top:#888}
main{flex:1;padding:16px;overflow:auto}
#statTable{border-collapse:collapse}
#statTable td{padding:4px 12px;border-bottom:1px solid #8884;word-break:break-all}
#statTable td:first-child{font-weight:600;white-space:nowrap}
#statBtns{margin-top:12px;display:flex;gap:8px}
#statBtns button{padding:6px 12px;cursor:pointer}
#urlbar{display:flex;gap:6px;margin-bottom:14px}
#urlOutput{flex:1;font-family:monospace;padding:6px;background:#ddd;border:1px solid #888}
#copyBtn{cursor:pointer;font-size:16px;padding:4px 10px}
.ub-layout{display:flex;gap:18px;align-items:flex-start}
.ub-list{flex:1;min-width:0}
.ub-side{flex:0 0 220px}
.src-item{border:1px solid #8888;margin-bottom:6px}
.src-item.disabled{opacity:.4;pointer-events:none}
.src-head{padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.src-sub{padding:0 8px 6px 8px}
.src-row{padding:3px 0 3px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.src-head.selected,.src-row.selected{background:#f90}
.src-head:hover,.src-row:hover{background:#ddd}
.field{margin-bottom:10px}
.field label{display:block;margin-bottom:2px}
.field select,.field input{width:100%;padding:4px}
.radio-group{display:flex;gap:14px}
.radio-group label{display:inline-flex;align-items:center;gap:4px;width:auto;margin-bottom:0}
#verText{color:#666;margin-top:-22px; font-size:80%}
.cli-kv{padding:2px 0}
</style>
</head>
<body>
<nav>
<h1>dipixy</h1>
<div id="verText">&nbsp;</div>
<hr>
<button onclick="show('status')">Status</button>
<button onclick="show('clients')">Clients</button>
<button onclick="show('urlbuilder')">URL Builder</button>
<hr>
</nav>
<main>
<section id="view-status">
<h2 id="statHead">loading...</h2>
<table id="statTable"></table>
<div id="statBtns">
<button onclick="sendCmd('playlists.reload')">reload playlists</button>
<button id="reloadCertBtn" onclick="sendCmd('tls.reload')" style="display:none">reload certificates</button>
</div>
</section>
<section id="view-clients" hidden>
<h2 id="clientsHead">Clients (0)</h2>
<div id="clientsList"></div>
</section>
<section id="view-urlbuilder" hidden>
<div id="urlbar">
<input type="text" id="urlOutput" readonly value="[select a source first]">
<button id="copyBtn" title="copy to clipboard">&#128203;</button>
</div>
<div class="ub-layout">
<div class="ub-list" id="srcList"></div>
<div class="ub-side">
<div class="field">
<label for="fmtSel">format</label>
<select id="fmtSel" onchange="updUrl()">
<option id="fmt-ts" value="ts">ts</option>
<option id="fmt-spts" value="spts">spts</option>
<option id="fmt-rawaudio" value="rawaudio">rawaudio</option>
<option id="fmt-hls" value="hls">hls</option>
<option id="fmt-hls-fmp4" value="hls-fmp4">hls-fmp4</option>
<option id="fmt-llhls" value="llhls">llhls</option>
<option id="fmt-dash" value="dash">dash</option>
</select>
</div>
<div class="field" id="filterField">
<label for="filterInp">filter (pids)</label>
<input type="text" id="filterInp" placeholder="101,0x20" oninput="updUrl()">
</div>
<div class="field">
<label for="pmtInp">pmt</label>
<input type="text" id="pmtInp" placeholder="0x1000" oninput="updUrl()">
</div>
<div class="field" id="listByField" style="display:none">
<label>list by</label>
<span class="radio-group">
<label><input type="radio" name="listBy" value="name" checked onchange="updUrl()"> name</label>
<label><input type="radio" name="listBy" value="index" onchange="updUrl()"> index</label>
</span>
</div>
<div class="field" id="itemByField" style="display:none">
<label>item by</label>
<span class="radio-group">
<label><input type="radio" name="itemBy" value="name" checked onchange="updUrl()"> name</label>
<label><input type="radio" name="itemBy" value="index" onchange="updUrl()"> index</label>
</span>
</div>
<div class="field" id="groupPortField" style="display:none">
<label for="groupInp" id="groupLbl">multicast group</label>
<input type="text" id="groupInp" placeholder="239.1.1.1" oninput="updUrl()">
<label for="portInp" style="margin-top:6px">port</label>
<input type="text" id="portInp" placeholder="5000" oninput="updUrl()">
</div>
</div>
</div>
</section>
</main>
<script>
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
var state = { status: null, sources: [], selection: null, clients: {}, clientRows: {} };
function show(name) {
  ['status', 'clients', 'urlbuilder'].forEach(function (v) {$('view-' + v).hidden = v !== name;});
  if (name === 'status') loadStat();
}
function loadStat() {
  $('statHead').textContent = 'loading...';
  fetch('/ui/status.js').then(function (r) {return r.json();}).then(function (d) {
    $('statHead').textContent = 'Status';
    $('reloadCertBtn').style.display = d.tls.enabled ? 'inline-block' : 'none';
    var t = $('statTable');
    t.innerHTML = '';
    [
      ['Build', d.build.type + ' ' + d.build.arch + ' ' + d.build.link],
      ['Features', Object.keys(d.build.features).filter(function (k) { return d.build.features[k]; }).join(' ')],
      ['Process start', d.start_time],
      ['Process uptime', d.uptime_seconds + ' seconds'],
      ['Process run', d.exec_args.join(' ')],
      ['Listen', d.listen.addr + ':' + d.listen.port],
      ['Threads', d.threads.total + ' = ' + d.threads.workers + ' worker (spec ' + d.server.workers_spec + '), ' + d.threads.pump + ' pump, ' + d.threads.channels_refresh + ' refresh'],
      ['Mem RSS', d.memory.rss_bytes + ' B = ' + (d.memory.rss_bytes / 1048576).toFixed(2) + ' MB'],
      ['Bitrate In', d.bitrate.in_mbps + ' mbps'],
      ['Bitrate Out', d.bitrate.out_mbps + ' mbps'],
      ['Capacity', 'max-clients ' + d.server.max_clients + ', capture-ring ' + d.server.capture_ring_kib + ' KiB'],
      ['Segments', d.segment.size_s + 's x ' + d.segment.count + ' (part ' + d.segment.hls_part_size_s + 's, pool ' + d.segment.hls_seg_pool + ')'],
      ['SD&S', 'timeout ' + d.sds.timeout_s + 's, refresh ' + d.sds.refresh_interval_s + 's, fcc ' + (d.flags.no_fcc ? 'off' : 'on') + ', ret ' + (d.flags.no_ret ? 'off' : 'on')],
      ['Disabled', Object.keys(d.flags).filter(function (k) { return k.indexOf('no_') === 0 && d.flags[k]; }).map(function (k) { return k.slice(3).replace(/_/g, '-'); }).join(', ') || 'none'],
      ['CORS', d.cors_origins],
      ['Auth', d.auth_enabled ? 'enabled' : 'disabled'],
      ['TLS', d.tls.enabled ? 'enabled at ' + d.listen.tls_addr + ':' + d.listen.tls_port : 'disabled']
    ].concat(d.tls.enabled ? [['TLS CN', d.tls.cn], ['TLS Expiry', d.tls.expiry]] : [])
     .concat(d.metrics.enabled ? [['Metrics', d.metrics.id + ', interval ' + (d.metrics.interval_s || 5) + 's' + (d.metrics.http ? ', http exposed' : '')]] : [])
     .concat(d.dlna.enabled ? [['DLNA', d.dlna.dlna_host + (d.dlna.dlna_name ? ' (' + d.dlna.dlna_name + ')' : '') + ', ttl ' + d.dlna.ssdp_ttl + ', interval ' + d.dlna.ssdp_interval_s + 's, max-age ' + d.dlna.ssdp_max_age_s + 's' + (d.dlna.keep_multicast ? ', keep-multicast' : '') + (d.dlna.ssdp_iface ? ', iface ' + d.dlna.ssdp_iface : '')]] : [])
     .forEach(function (r) {
      var tr = t.insertRow();
      tr.insertCell().textContent = r[0];
      tr.insertCell().textContent = r[1];
    });
  }).catch(function () {
    $('statHead').textContent = 'failed to load status';
  });
}
function appFlags() {
  var flags = (state.status && state.status.flags) || {};
  ['ts', 'spts', 'rawaudio', 'hls', 'hls-fmp4', 'llhls', 'dash'].forEach(function (fmt) {$('fmt-' + fmt).disabled = !!flags['no_' + (fmt === 'hls-fmp4' ? 'hls' : fmt)];});
  $('filterField').style.display = flags.no_pid_filters ? 'none' : 'block';
}
function renderSrc() {
  var list = $('srcList');
  list.innerHTML = '';
  var flags = (state.status && state.status.flags) || {};
  var singles = [], lists = [];
  state.sources.forEach(function (s) {(s.kind === 'stdin' || s.kind === 'rist' ? singles : lists).push(s);});
  [['rtp', 'no_url_rtp'], ['udp', 'no_url_udp'], ['srt', 'no_url_srt']].forEach(function (p) {list.appendChild(mkSrcItem({ kind: p[0], num: '-', name: '-', entries: '-', disabled: !!flags[p[1]] }));});
  singles.forEach(function (s) {list.appendChild(mkSrcItem({ kind: s.kind, num: '-', name: s.name || '-', entries: '-', srcName: s.name }));});
  lists.forEach(function (s) {
    list.appendChild(mkSrcItem({
      kind: s.kind,
      num: s.list_num || '-',
      name: s.name || '-',
      entries: s.items ? s.items.length : 1,
      items: s.items,
      list_num: s.list_num,
      srcName: s.name
    }));
  });
}
function mkSrcItem(o) {
  var div = el('div', 'src-item' + (o.disabled ? ' disabled' : ''));
  var head = el('div', 'src-head');
  head.appendChild(el('span', '', '#' + o.num + ' [' + o.kind + '] ' + o.name));
  head.appendChild(el('span', '', o.entries));
  div.appendChild(head);
  var sub = el('div', 'src-sub');
  sub.style.display = 'none';
  div.appendChild(sub);
  head.onclick = function () {
    if (o.kind === 'rtp' || o.kind === 'udp' || o.kind === 'srt') {
      select({ kind: o.kind }, true, head);
      return;
    }
    if (o.kind === 'stdin' || o.kind === 'rist') {
      select({ kind: o.kind, name: o.srcName }, false, head);
      return;
    }
    var open = sub.style.display !== 'none';
    document.querySelectorAll('.src-sub').forEach(function (e) { e.style.display = 'none'; });
    if (open)
      return;
    sub.innerHTML = '';
    (o.items || []).forEach(function (it, i) {
      var row = el('div', 'src-row');
      row.appendChild(el('span', '', it.name || '-'));
      row.appendChild(el('span', '', it.uri));
      row.onclick = function (ev) {
        ev.stopPropagation();
        select({ kind: 'list', listNum: o.list_num, name: o.srcName, itemNum: i + 1, itemName: it.name }, false, row);
      };
      sub.appendChild(row);
    });
    sub.style.display = 'block';
  };
  return div;
}
function select(sel, showGroup, el) {
  document.querySelectorAll('.src-head.selected, .src-row.selected').forEach(function (e) {e.classList.remove('selected');});
  el.classList.add('selected');
  state.selection = sel;
  $('groupPortField').style.display = showGroup ? 'block' : 'none';
  if (showGroup) $('groupLbl').textContent = sel.kind === 'srt' ? 'address' : 'multicast group';
  var isList = sel.kind === 'list';
  $('listByField').style.display = isList ? 'block' : 'none';
  $('itemByField').style.display = isList ? 'block' : 'none';
  updUrl();
}
function buildUrl() {
  var sel = state.selection;
  if (!sel) return '[selection incomplete]';
  var fmt = $('fmtSel').value;
  var path;
  if (sel.kind === 'rtp' || sel.kind === 'udp' || sel.kind === 'srt') {
    var group = $('groupInp').value.trim();
    var port = $('portInp').value.trim();
    if (!group || !port) return '[selection incomplete]';
    path = '/' + sel.kind + '/' + group + ':' + port + '/' + fmt;
  } else if (sel.kind === 'stdin' || sel.kind === 'rist') {
    path = '/' + encodeURIComponent(sel.name || sel.kind) + '/' + fmt;
  } else {
    var listByIdx = document.querySelector('input[name=listBy]:checked').value === 'index';
    var itemByIdx = document.querySelector('input[name=itemBy]:checked').value === 'index';
    var base = (!listByIdx && sel.name) ? encodeURIComponent(sel.name) : ('list/' + sel.listNum);
    var itemSeg = (!itemByIdx && sel.itemName) ? ('name/' + encodeURIComponent(sel.itemName)) : ('item/' + sel.itemNum);
    path = '/' + base + '/' + itemSeg + '/' + fmt;
  }
  var params = [];
  var filter = $('filterInp').value.trim();
  var pmt = $('pmtInp').value.trim();
  if (filter) params.push('filter=' + encodeURIComponent(filter));
  if (pmt) params.push('pmt=' + encodeURIComponent(pmt));
  if (params.length) path += '?' + params.join('&');
  return location.origin + path;
}
function updUrl() {
  $('urlOutput').value = buildUrl();
}
$('copyBtn').onclick = function () {
  var el = $('urlOutput');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value);
  } else {
    el.select();
    document.execCommand('copy');
  }
};
function sendCmd(type) {
  if (state.ws && state.ws.readyState === WebSocket.OPEN)
    state.ws.send('{"type":"' + type + '"}');
}
function fmtDur(s) {
  var m;
  s = Math.max(0, Math.floor(s));
  if (s < 60) return String(s);
  m = Math.floor(s / 60);
  s %= 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function addKVLine(parent, pairs) {
  var line = el('div', 'cli-kv');
  pairs.forEach(function (kv, i) {
    line.appendChild(el('b', '', kv[0] + ': '));
    line.appendChild(document.createTextNode(kv[1] + (i < pairs.length - 1 ? ' ' : '')));
  });
  parent.appendChild(line);
}
function mkCliItem(o) {
  var div = el('div', 'src-item');
  div.dataset.ip = o.ip;
  var head = el('div', 'src-head');
  head.appendChild(el('span', '', o.ip + '  ' + (o.src_proto || '-') + '://' + (o.src_addr || '') + '/' + o.fmt));
  var dur = el('span');
  dur.id = 'cli-dur-' + o.id;
  dur.textContent = fmtDur(Date.now() / 1000 - o.connect_time);
  head.appendChild(dur);
  div.appendChild(head);
  var sub = el('div', 'src-sub');
  sub.style.display = 'none';
  var l1 = el('div', 'cli-kv');
  l1.appendChild(document.createTextNode((o.http_ver === 3 ? 'HTTP/3' : o.http_ver === 2 ? 'HTTP/2' : 'HTTP/1.1') + ' '));
  l1.appendChild(el('b', '', 'bitrate: '));
  var mbpsEl = el('span');
  mbpsEl.id = 'cli-mbps-' + o.id;
  mbpsEl.textContent = (o.mbps || 0).toFixed(2);
  l1.appendChild(mbpsEl);
  l1.appendChild(document.createTextNode(' mbps'));
  sub.appendChild(l1);
  addKVLine(sub, [['format', o.fmt], ['pmt', o.pmt ? '0x' + o.pmt.toString(16) : 'auto'], ['filter', o.filter || '-']]);
  addKVLine(sub, [
    ['source', o.src_proto || '-'],
    ['input', o.src_ordinal ? '#' + o.src_ordinal + (o.src_name ? ' ' + o.src_name : '') : '-'],
    ['item', o.item_num ? '#' + o.item_num + (o.item_name ? ' ' + o.item_name : '') : '-']
  ]);
  div.appendChild(sub);
  head.onclick = function () {sub.style.display = sub.style.display === 'none' ? 'block' : 'none';};
  return div;
}
function cliHeadUpdate() {
  $('clientsHead').textContent = 'Clients (' + Object.keys(state.clients).length + ')';
}
function insertClientRow(el, ip) {
  var list = $('clientsList');
  var children = list.children;
  var i;
  for (i = 0; i < children.length && children[i].dataset.ip <= ip; i++);
  list.insertBefore(el, children[i] || null);
}
function addClient(c) {
  var el;
  if (state.clientRows[c.id])
    return;
  state.clients[c.id] = c;
  el = mkCliItem(c);
  state.clientRows[c.id] = el;
  insertClientRow(el, c.ip);
  cliHeadUpdate();
}
function removeClient(id) {
  var el = state.clientRows[id];
  if (el && el.parentNode) el.parentNode.removeChild(el);
  delete state.clientRows[id];
  delete state.clients[id];
  cliHeadUpdate();
}
function renderClientsFull(clients) {
  $('clientsList').innerHTML = '';
  state.clients = {};
  state.clientRows = {};
  clients.slice().sort(function (a, b) { return a.ip < b.ip ? -1 : a.ip > b.ip ? 1 : 0; }).forEach(addClient);
}
setInterval(function () {
  Object.keys(state.clients).forEach(function (id) {
    var el = $('cli-dur-' + id);
    if (el) el.textContent = fmtDur(Date.now() / 1000 - state.clients[id].connect_time);
  });
}, 1000);
function wsConn() {
  var ws = state.ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ui/ws/');
  ws.onopen = function () {
    ws.send('{"type":"sources.get"}');
    ws.send('{"type":"clients.get"}');
  };
  ws.onmessage = function (ev) {
    var msg = JSON.parse(ev.data), src, i;
    if (msg.type === 'sources.snapshot') {
      state.sources = msg.sources || [];
      renderSrc();
    } else if (msg.type === 'sources.update') {
      src = msg.sources[0];
      for (i = 0; i < state.sources.length && state.sources[i].list_num !== src.list_num; i++);
      if (i < state.sources.length) state.sources[i] = src; else state.sources.push(src);
      renderSrc();
    } else if (msg.type === 'tls.reload') {
      if (msg.ok) loadStat();
    } else if (msg.type === 'clients.snapshot') {
      renderClientsFull(msg.clients || []);
    } else if (msg.type === 'clients.add') {
      addClient(msg.client);
    } else if (msg.type === 'clients.remove') {
      removeClient(msg.id);
    } else if (msg.type === 'clients.remove_many') {
      (msg.ids || []).forEach(removeClient);
    } else if (msg.type === 'clients.tick') {
      (msg.clients || []).forEach(function (t) {
        var el;
        if (!state.clients[t.id]) return;
        state.clients[t.id].mbps = t.mbps;
        el = $('cli-mbps-' + t.id);
        if (el) el.textContent = t.mbps.toFixed(2);
      });
    }
  };
  ws.onclose = function () {
    state.ws = null;
    setTimeout(wsConn, 2000);
  };
}
fetch('/ui/status.js').then(function (r) {
  return r.json();
}).then(function (data) {
  state.status = data;
  $('verText').textContent = 'v' + (data.version || '?');
  appFlags();
  renderSrc();
  wsConn();
}).catch(function () {$('verText').textContent = '';});
show('status');
</script>
</body>
</html>
