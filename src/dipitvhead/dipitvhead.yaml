# -i|--input [not set]
#input:
  #- rtp://@239.19.75.1:8700
  #- https://example.com/live/x/y.ts:
    # -p|--pmt-pid [not set] # dec or 0x-hex
    #pmt-pid: 0x0100
    # --sid [auto]
    #sid: 2
    # -s|--sdt [passthrough] # '-' drops
    #sdt: Some Channel
    # --provider [not set]
    #provider: <name>
    # -I|--iface [not set]
    #iface: <iface>
    # --strip-eit off
    #strip-eit: off
    # --strip none # comma list of DATA,ECM
    #strip: none
    # --hbbtv [not set]
    #hbbtv: <url>
    # --hbbtv-org-id [not set] # required with hbbtv
    #hbbtv-org-id: <n>
    # --hbbtv-app-id [not set] # required with hbbtv
    #hbbtv-app-id: <n>
    # --rist-profile-in simple # simple|main, rist:// only
    #rist-profile-in: simple
    # --srt-passphrase-in [not set] # srt:// only
    #srt-passphrase-in: <pw>
    # --srt-pbkeylen-in [not set] # 16|24|32
    #srt-pbkeylen-in: 16
    # --srt-streamid-in [not set]
    #srt-streamid-in: <id>
    # --srt-packetfilter-in [not set]
    #srt-packetfilter-in: <cfg>
    # --srt-latency-in [not set] # ms
    #srt-latency-in: <ms>

# -m|--mcast [not set]
#mcast: 239.1.1.1:5000
# -O|--out-iface [not set]
#out-iface: <iface>
# -u|--udp off # on = plain UDP instead of RTP
udp: off
# -T|--ttl 1
ttl: 1
# --dscp video-high # video-high|video-low|voice|signalling|best-effort|0..63
dscp: video-high
# --al-fec [not set]
#al-fec: <L>:<D>
# --al-fec-port [not set]
#al-fec-port: <port>
# -n|--nit [not set] # '-' drops
#nit: <text>
# --default-provider dipitvhead
default-provider: dipitvhead
# -b|--bitrate [not set] # kbps
#bitrate: <kbps>
# -S|--stuff off
stuff: off
# -B|--burst-limit off
burst-limit: off
# -e|--error 0 # seconds, 0 = fail once
error: 0
# -k|--insecure off
insecure: off
# --tsid 1
tsid: 1
# --onid 1
onid: 1

# -R|--remote [not set]
#remote:
  #- rist://host:port
rist:
  # --rist-profile simple # simple|main
  #profile: simple
  # --rist-secret [not set]
  #secret: <psk>
  # --rist-cname [not set]
  #cname: <name>
  # --rist-buffer [not set] # ms
  #buffer: <ms>
srt:
  # --srt-group-mode [not set] # broadcast|backup
  #group-mode: broadcast
  # --srt-passphrase [not set]
  #passphrase: <pw>
  # --srt-pbkeylen [not set] # 16|24|32
  #pbkeylen: 16
  # --srt-streamid [not set]
  #streamid: <id>
  # --srt-packetfilter [not set]
  #packetfilter: <cfg>
  # --srt-latency [not set] # ms
  #latency: <ms>

metrics:
  # --metrics /run/dvbipitools/metrics.sock
  #sock: /run/dvbipitools/metrics.sock
  # --metrics-id [not set]
  #id: <name>
  # --metrics-interval 5 # seconds
  #interval: 5
  # --metrics-inspect-ts off # off|basic|medium|full
  #inspect-ts: off
  # --metrics-inspect-ts-pids [not set]
  #inspect-ts-pids: 0x100,0x101

cas:
  # --cas-algo [not set] # cissa|csa2|csa1
  #algo: csa2
  # --cas-pids video,audio # pids and/or video|audio|lcevc
  #pids: video,audio
  # --cas-cp-duration 10000 # ms
  #cp-duration: 10000
  # --cas-fallback-clear off
  #fallback-clear: off
  # --cas-ecmg [not set]
  #ecmg:
  #  - tcp://host:2222
  #  - tcp://host:2223:
        # --cas-ecmg-version [auto-negotiate] # 2|3
        #ecmg-version: 3
        # --cas-super-id [not set]
        #super-id: 0x1234
        # --cas-ecm-id [not set]
        #ecm-id: 1
        # --cas-ecm-pid 0x0020
        #ecm-pid: 0x0020
        # --cas-emmg-port 8002
        #emmg-port: 8002
        # --cas-emmg-max-conns 8 # max 64
        #emmg-max-conns: 8
        # --cas-emmg-version [client proposal] # 2|3
        #emmg-version: 3
        # --cas-emmg-reverse [not set]
        #emmg-reverse: tcp://host:8003
        # --cas-emm-pid 0x0021
        #emm-pid: 0x0021
        # --cas-resilience frozen # frozen|cycling|silent
        #resilience: frozen
        # --cas-required off
        #required: off
        # --cas-cwenc-algo [not set] # des56|aes128|aes256
        #cwenc-algo: aes128
        # --cas-cwenc-aes-mode stream # stream|ecb
        #cwenc-aes-mode: stream
        # --cas-cwenc-fixed-key [Annex D ROM]
        #cwenc-fixed-key: <hex>
        # --cas-cwenc-key-list-a [not set]
        #cwenc-key-list-a: <path>
        # --cas-cwenc-key-list-b [not set]
        #cwenc-key-list-b: <path>

biss1:
  # --biss1-sw [not set] # 12 hex chars
  #sw: <hex12>

biss2:
  # --biss2-sw [not set] # 32 hex chars
  #sw: <hex32>
  # --biss2-emit-esw [not set] # 32 hex chars
  #emit-esw: <hex32>
  # --biss2-ca-receivers [not set]
  #ca-receivers: <dir>
  # --biss2-ca-session-id [random] # 16 bit, dec or 0x-hex
  #ca-session-id: <n>

# -v|--verbose off
verbose: off
# --color auto # auto|always|never
color: auto
# -d|--daemonize off
daemonize: off
