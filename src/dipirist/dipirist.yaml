# -i|--in [not set]
#in:
#  - rtp://@239.1.1.1:5000
# -o|--out [not set]
#out:
#  - rist://1.2.3.4:6000
# -I|--iface [not set]
#iface: <iface>
# -k|--insecure off
insecure: off
# --profile simple # simple|main
profile: simple
# --secret [not set]
#secret: <psk>
# --cname [not set]
#cname: <name>
# --buffer [not set] # ms
#buffer: <ms>
# --al-fec [not set]
#al-fec: <L>:<D>
# --al-fec-port [not set]
#al-fec-port: <port>

metrics:
  # --metrics /run/dvbipitools/metrics.sock
  #sock: /run/dvbipitools/metrics.sock
  # --metrics-id [not set]
  #id: <name>
  # --metrics-interval 5 # seconds
  #interval: 5
  # --metrics-inspect-ts off # off|basic|medium|full
  #inspect-ts: off

# --color auto # auto|always|never
color: auto

# -v|--verbose off
verbose: off

# -d|--daemonize off
daemonize: off
